# Labels conferidas na VPS principal (72.61.135.214): traefik v3.1, rede
# externa `proxy`, certresolver `mytlschallenge` (tlschallenge).
services:
  twitter-scraper:
    build: .
    container_name: twitter-scraper
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    environment:
      - SCRAPER_TOKEN=${SCRAPER_TOKEN}
      - COOKIES_PATH=/data/cookies.json
    volumes:
      - ./data:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.twitterscraper.rule=Host(`twitter-scraper.itbooster.com.br`)
      - traefik.http.routers.twitterscraper.entrypoints=websecure
      - traefik.http.routers.twitterscraper.tls.certresolver=mytlschallenge
      - traefik.http.services.twitterscraper.loadbalancer.server.port=8000

networks:
  proxy:
    external: true
